name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - dev

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.5-pg18-bookworm
        env:
          POSTGRES_DB: zhixu_test
          POSTGRES_USER: zhixu_test
          POSTGRES_PASSWORD: ci_only_change_me
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U zhixu_test -d zhixu_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.4"
          cache: true
          cache-dependency-path: |
            go.sum
            poc/eino/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: "24.18.0"
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            api/openapi/package-lock.json

      - name: Install OpenAPI tooling
        run: make openapi-install

      - name: Audit OpenAPI tooling
        run: npm audit --prefix api/openapi --audit-level=high

      - name: Install web dependencies
        run: make web-install

      - name: Install Playwright Chrome
        working-directory: web
        run: npx playwright install --with-deps chrome

      - name: Run quality gates
        run: make test

      - name: Check generated OpenAPI client drift
        run: make openapi-generate-check

      - name: Run OpenAPI breaking-change gate
        env:
          OPENAPI_BASE_REVISION: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: make openapi-breaking-check

      - name: Run Collection and Health static delivery gates
        run: |
          bash -n deploy/collection-health-*.sh
          make collection-health-secret-scan
          npm audit --prefix web --audit-level=high

      - name: Validate Atlas migration directory
        env:
          ATLAS_IMAGE: arigaio/atlas@sha256:dce85fd3f83c9c28f343c73236c8917f802d526f1fe921e150b720077a83c5ae
        run: |
          make atlas-migrate-lint
          make atlas-migrate-hash-check
          make atlas-migrate-validate

      - name: Run Collection and Health PostgreSQL gates
        env:
          ZHIXU_DATABASE_HOST: 127.0.0.1
          ZHIXU_DATABASE_PORT: "5432"
          ZHIXU_DATABASE_NAME: zhixu_test
          ZHIXU_DATABASE_USER: zhixu_test
          ZHIXU_DATABASE_PASSWORD: ci_only_change_me
          ZHIXU_DATABASE_SSLMODE: disable
          ATLAS_IMAGE: arigaio/atlas@sha256:dce85fd3f83c9c28f343c73236c8917f802d526f1fe921e150b720077a83c5ae
          POSTGRES_CLIENT_IMAGE: pgvector/pgvector@sha256:1d533553fefe4f12e5d80c7b80622ba0c382abb5758856f52983d8789179f0fb
        run: |
          export ZHIXU_DATABASE_URL="$(python3 -c 'import os; print("postgres" + "://" + os.environ["ZHIXU_DATABASE_USER"] + ":" + os.environ["ZHIXU_DATABASE_PASSWORD"] + "@" + os.environ["ZHIXU_DATABASE_HOST"] + ":" + os.environ["ZHIXU_DATABASE_PORT"] + "/" + os.environ["ZHIXU_DATABASE_NAME"] + "?sslmode=" + os.environ["ZHIXU_DATABASE_SSLMODE"])')"
          export ZHIXU_TEST_DATABASE_URL="$(python3 -c 'import os; print("postgres" + "://" + os.environ["ZHIXU_DATABASE_USER"] + ":" + os.environ["ZHIXU_DATABASE_PASSWORD"] + "@" + os.environ["ZHIXU_DATABASE_HOST"] + ":" + os.environ["ZHIXU_DATABASE_PORT"] + "/" + os.environ["ZHIXU_DATABASE_NAME"] + "?sslmode=" + os.environ["ZHIXU_DATABASE_SSLMODE"])')"
          export ZHIXU_ATLAS_DEV_URL="$(python3 -c 'import os; print("postgres" + "://" + os.environ["ZHIXU_DATABASE_USER"] + ":" + os.environ["ZHIXU_DATABASE_PASSWORD"] + "@" + os.environ["ZHIXU_DATABASE_HOST"] + ":" + os.environ["ZHIXU_DATABASE_PORT"] + "/zhixu_atlas_dev?sslmode=" + os.environ["ZHIXU_DATABASE_SSLMODE"])')"
          docker run --rm --network host \
            -e PGPASSWORD="$ZHIXU_DATABASE_PASSWORD" \
            "$POSTGRES_CLIENT_IMAGE" createdb \
            --host "$ZHIXU_DATABASE_HOST" --port "$ZHIXU_DATABASE_PORT" \
            --username "$ZHIXU_DATABASE_USER" zhixu_atlas_dev
          go run ./cmd/migrate
          make atlas-schema-drift
          make collection-health-integration
          make collection-health-fault-smoke
          make collection-health-benchmark
          make collection-health-browser-smoke

      - name: Build runtime image
        run: make docker-build
