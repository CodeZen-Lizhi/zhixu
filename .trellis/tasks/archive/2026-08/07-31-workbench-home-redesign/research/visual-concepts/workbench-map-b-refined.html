    <div class="shell map-shell">

      <main class="map-main refined">
        <header class="map-topbar">
          <span class="map-caption">KNOWLEDGE LINEAGE / ENTRY</span>
          <div class="map-topbar-right"><span class="local-mode">本地模式</span><span>数据边界</span><span>帮助</span></div>
        </header>

        <section class="map-stage refined-stage">
          <div class="map-copy refined-copy">
            <p class="micro">LOCAL KNOWLEDGE, IN ORDER</p>
            <h1>知序</h1>
            <h2>让每一条知识，<br />都看得见来路。</h2>
            <p>连接本地 Markdown，把资料、版本、关系与 AI 建议放回同一条可追溯的脉络。</p>
            <div class="map-actions">
              <button class="primary-button">
                连接知识目录
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6" /></svg>
              </button>
              <button class="quiet-button">查看数据边界</button>
            </div>
          </div>
