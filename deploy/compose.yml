services:
  postgres:
    image: pgvector/pgvector:0.8.5-pg18-bookworm
    environment:
      POSTGRES_DB: ${ZHIXU_POSTGRES_DB:-zhixu}
      POSTGRES_USER: ${ZHIXU_POSTGRES_USER:-zhixu}
      POSTGRES_PASSWORD: ${ZHIXU_POSTGRES_PASSWORD:?set ZHIXU_POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data
    volumes:
      - zhixu-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "PGPASSWORD=$$POSTGRES_PASSWORD psql -U $$POSTGRES_USER -d $$POSTGRES_DB -c 'SELECT 1' >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    entrypoint: ["/app/zhixu-migrate"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ZHIXU_DATABASE_HOST: postgres
      ZHIXU_DATABASE_PORT: 5432
      ZHIXU_DATABASE_NAME: ${ZHIXU_POSTGRES_DB:-zhixu}
      ZHIXU_DATABASE_USER: ${ZHIXU_POSTGRES_USER:-zhixu}
      ZHIXU_DATABASE_PASSWORD: ${ZHIXU_POSTGRES_PASSWORD:?set ZHIXU_POSTGRES_PASSWORD}

  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      ZHIXU_VERSION: ${ZHIXU_VERSION:-dev}
      ZHIXU_HTTP_ADDR: 0.0.0.0:8080
      ZHIXU_DATABASE_HOST: postgres
      ZHIXU_DATABASE_PORT: 5432
      ZHIXU_DATABASE_NAME: ${ZHIXU_POSTGRES_DB:-zhixu}
      ZHIXU_DATABASE_USER: ${ZHIXU_POSTGRES_USER:-zhixu}
      ZHIXU_DATABASE_PASSWORD: ${ZHIXU_POSTGRES_PASSWORD:?set ZHIXU_POSTGRES_PASSWORD}
      ZHIXU_WEB_ASSETS_DIR: /app/web
      ZHIXU_WORKER_QUEUE: ${ZHIXU_WORKER_QUEUE:-workflow}
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${ZHIXU_HTTP_PORT:-8080}:8080"
    volumes:
      - ${ZHIXU_WORKSPACE_ROOT:-../workspace}:/workspace
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/readyz"]
      interval: 5s
      timeout: 3s
      retries: 20

  worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    entrypoint: ["/app/zhixu-worker"]
    environment:
      ZHIXU_VERSION: ${ZHIXU_VERSION:-dev}
      ZHIXU_DATABASE_HOST: postgres
      ZHIXU_DATABASE_PORT: 5432
      ZHIXU_DATABASE_NAME: ${ZHIXU_POSTGRES_DB:-zhixu}
      ZHIXU_DATABASE_USER: ${ZHIXU_POSTGRES_USER:-zhixu}
      ZHIXU_DATABASE_PASSWORD: ${ZHIXU_POSTGRES_PASSWORD:?set ZHIXU_POSTGRES_PASSWORD}
      ZHIXU_WORKER_HEALTH_ADDR: 0.0.0.0:8081
      ZHIXU_WORKER_QUEUE: ${ZHIXU_WORKER_QUEUE:-workflow}
      ZHIXU_WORKER_MAX_WORKERS: ${ZHIXU_WORKER_MAX_WORKERS:-4}
      ZHIXU_WORKER_JOB_TIMEOUT: ${ZHIXU_WORKER_JOB_TIMEOUT:-15m}
      ZHIXU_WORKER_RESCUE_STUCK_AFTER: ${ZHIXU_WORKER_RESCUE_STUCK_AFTER:-30m}
      ZHIXU_WORKFLOW_LEASE: ${ZHIXU_WORKFLOW_LEASE:-2m}
      ZHIXU_WORKFLOW_HEARTBEAT: ${ZHIXU_WORKFLOW_HEARTBEAT:-30s}
      ZHIXU_REINDEX_DISPATCH_POLL_INTERVAL: ${ZHIXU_REINDEX_DISPATCH_POLL_INTERVAL:-1s}
      ZHIXU_REINDEX_DISPATCH_BATCH_SIZE: ${ZHIXU_REINDEX_DISPATCH_BATCH_SIZE:-10}
      ZHIXU_REINDEX_DISPATCH_ERROR_BACKOFF: ${ZHIXU_REINDEX_DISPATCH_ERROR_BACKOFF:-5s}
      ZHIXU_REINDEX_LEASE_DURATION: ${ZHIXU_REINDEX_LEASE_DURATION:-2m}
      ZHIXU_REINDEX_HEARTBEAT_INTERVAL: ${ZHIXU_REINDEX_HEARTBEAT_INTERVAL:-30s}
      ZHIXU_EMBEDDING_PROVIDER: ${ZHIXU_EMBEDDING_PROVIDER:-disabled}
      ZHIXU_EMBEDDING_BASE_URL: ${ZHIXU_EMBEDDING_BASE_URL:-}
      ZHIXU_EMBEDDING_API_KEY: ${ZHIXU_EMBEDDING_API_KEY:-}
      ZHIXU_EMBEDDING_MODEL: ${ZHIXU_EMBEDDING_MODEL:-}
      ZHIXU_EMBEDDING_DIMENSIONS: ${ZHIXU_EMBEDDING_DIMENSIONS:-0}
      ZHIXU_EMBEDDING_NORMALIZATION: ${ZHIXU_EMBEDDING_NORMALIZATION:-l2}
      ZHIXU_EMBEDDING_DISTANCE_METRIC: ${ZHIXU_EMBEDDING_DISTANCE_METRIC:-cosine}
      ZHIXU_EMBEDDING_MAX_BATCH_SIZE: ${ZHIXU_EMBEDDING_MAX_BATCH_SIZE:-128}
      ZHIXU_EMBEDDING_MAX_INPUT_BYTES: ${ZHIXU_EMBEDDING_MAX_INPUT_BYTES:-65536}
      ZHIXU_EMBEDDING_MAX_BATCH_INPUT_BYTES: ${ZHIXU_EMBEDDING_MAX_BATCH_INPUT_BYTES:-8388608}
      ZHIXU_EMBEDDING_TIMEOUT: ${ZHIXU_EMBEDDING_TIMEOUT:-30s}
      ZHIXU_EMBEDDING_MAX_RESPONSE_BYTES: ${ZHIXU_EMBEDDING_MAX_RESPONSE_BYTES:-67108864}
      ZHIXU_RETRIEVAL_RRF_K: ${ZHIXU_RETRIEVAL_RRF_K:-60}
      ZHIXU_RETRIEVAL_RRF_LEXICAL_CANDIDATE_LIMIT: ${ZHIXU_RETRIEVAL_RRF_LEXICAL_CANDIDATE_LIMIT:-200}
      ZHIXU_RETRIEVAL_RRF_VECTOR_CANDIDATE_LIMIT: ${ZHIXU_RETRIEVAL_RRF_VECTOR_CANDIDATE_LIMIT:-200}
      ZHIXU_RETRIEVAL_RRF_FUSED_CANDIDATE_LIMIT: ${ZHIXU_RETRIEVAL_RRF_FUSED_CANDIDATE_LIMIT:-100}
      ZHIXU_RETRIEVAL_RRF_RERANK_CANDIDATE_LIMIT: ${ZHIXU_RETRIEVAL_RRF_RERANK_CANDIDATE_LIMIT:-50}
      ZHIXU_WORKER_SOFT_STOP_TIMEOUT: ${ZHIXU_WORKER_SOFT_STOP_TIMEOUT:-30s}
      ZHIXU_WORKER_HARD_STOP_TIMEOUT: ${ZHIXU_WORKER_HARD_STOP_TIMEOUT:-60s}
      ZHIXU_TELEMETRY_MODE: ${ZHIXU_TELEMETRY_MODE:-disabled}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - ${ZHIXU_WORKSPACE_ROOT:-../workspace}:/workspace
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8081/readyz"]
      interval: 5s
      timeout: 3s
      retries: 20
    stop_grace_period: ${ZHIXU_WORKER_STOP_GRACE_PERIOD:-70s}
    restart: on-failure

volumes:
  zhixu-postgres:
