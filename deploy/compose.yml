x-tool-environment: &tool-environment
  ZHIXU_TOOL_RUNTIME_MODE: ${ZHIXU_TOOL_RUNTIME_MODE:-enabled}
  ZHIXU_WEB_FETCH_MODE: ${ZHIXU_WEB_FETCH_MODE:-disabled}
  ZHIXU_WEB_FETCH_TIMEOUT: ${ZHIXU_WEB_FETCH_TIMEOUT:-30s}
  ZHIXU_WEB_FETCH_RESPONSE_HEADER_TIMEOUT: ${ZHIXU_WEB_FETCH_RESPONSE_HEADER_TIMEOUT:-10s}
  ZHIXU_WEB_FETCH_TLS_HANDSHAKE_TIMEOUT: ${ZHIXU_WEB_FETCH_TLS_HANDSHAKE_TIMEOUT:-10s}
  ZHIXU_WEB_FETCH_MAX_REDIRECTS: ${ZHIXU_WEB_FETCH_MAX_REDIRECTS:-5}
  ZHIXU_WEB_FETCH_MAX_URL_BYTES: ${ZHIXU_WEB_FETCH_MAX_URL_BYTES:-8192}
  ZHIXU_WEB_FETCH_MAX_RESPONSE_HEADER_BYTES: ${ZHIXU_WEB_FETCH_MAX_RESPONSE_HEADER_BYTES:-65536}
  ZHIXU_WEB_FETCH_MAX_BODY_BYTES: ${ZHIXU_WEB_FETCH_MAX_BODY_BYTES:-2097152}
  ZHIXU_WEB_FETCH_MAX_TEXT_BYTES: ${ZHIXU_WEB_FETCH_MAX_TEXT_BYTES:-524288}
  ZHIXU_WEB_FETCH_MAX_RESOLVED_IPS: ${ZHIXU_WEB_FETCH_MAX_RESOLVED_IPS:-16}
  ZHIXU_WEB_FETCH_ALLOWED_CONTENT_TYPES: ${ZHIXU_WEB_FETCH_ALLOWED_CONTENT_TYPES:-text/plain,text/html}

name: zhixu

x-runtime-environment: &runtime-environment
  ZHIXU_ENVIRONMENT: ${ZHIXU_ENVIRONMENT:-development}

x-telemetry-environment: &telemetry-environment
  ZHIXU_TELEMETRY_MODE: ${ZHIXU_TELEMETRY_MODE:-disabled}
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}

x-model-settings-environment: &model-settings-environment
  ZHIXU_MODEL_SETTINGS_MODE: ${ZHIXU_MODEL_SETTINGS_MODE:-managed}
  ZHIXU_MODEL_SETTINGS_KEY_FILE: /run/zhixu-model-secrets/model-settings.key

x-api-auth-environment: &api-auth-environment
  ZHIXU_AUTH_MODE: ${ZHIXU_AUTH_MODE:-required}
  ZHIXU_AUTH_BOOTSTRAP_TOKEN: ${ZHIXU_AUTH_BOOTSTRAP_TOKEN:-}
  ZHIXU_REVIEW_QUESTION_REF_KEY: ${ZHIXU_REVIEW_QUESTION_REF_KEY:-}
  ZHIXU_AUTH_SESSION_TTL: ${ZHIXU_AUTH_SESSION_TTL:-12h}
  ZHIXU_AUTH_API_TOKEN_TTL: ${ZHIXU_AUTH_API_TOKEN_TTL:-720h}
  ZHIXU_AUTH_SECURE_COOKIE: ${ZHIXU_AUTH_SECURE_COOKIE:-false}
  ZHIXU_AUTH_ALLOWED_ORIGINS: ${ZHIXU_AUTH_ALLOWED_ORIGINS:-http://127.0.0.1:${ZHIXU_HTTP_PORT:-8080}}

services:
  postgres:
    image: pgvector/pgvector:0.8.5-pg18-bookworm
    environment:
      POSTGRES_DB: ${ZHIXU_POSTGRES_DB:-zhixu}
      POSTGRES_USER: ${ZHIXU_POSTGRES_USER:-zhixu}
      POSTGRES_PASSWORD: ${ZHIXU_POSTGRES_PASSWORD:?set ZHIXU_POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data
    volumes:
      - zhixu-postgres:/var/lib/postgresql/data
    ports:
      - target: 5432
        host_ip: 127.0.0.1
        protocol: tcp
    healthcheck:
      test: ["CMD-SHELL", "PGPASSWORD=$$POSTGRES_PASSWORD psql -U $$POSTGRES_USER -d $$POSTGRES_DB -c 'SELECT 1' >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 20

  model-settings-key-init:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    entrypoint: ["/app/model-secrets-init.sh"]
    user: "0:0"
    environment:
      ZHIXU_MODEL_SETTINGS_KEY_DIR: /var/lib/zhixu/model-secrets
    volumes:
      - zhixu-model-secrets:/var/lib/zhixu/model-secrets

  migrate:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    entrypoint: ["/app/zhixu-migrate"]
    depends_on:
      postgres:
        condition: service_healthy
      model-settings-key-init:
        condition: service_completed_successfully
    environment:
      ZHIXU_DATABASE_HOST: postgres
      ZHIXU_DATABASE_PORT: 5432
      ZHIXU_DATABASE_NAME: ${ZHIXU_POSTGRES_DB:-zhixu}
      ZHIXU_DATABASE_USER: ${ZHIXU_POSTGRES_USER:-zhixu}
      ZHIXU_DATABASE_PASSWORD: ${ZHIXU_POSTGRES_PASSWORD:?set ZHIXU_POSTGRES_PASSWORD}

  app:
    profiles: ["workspace-runtime"]
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    user: "10001:10001"
    environment:
      <<: [*tool-environment, *runtime-environment, *model-settings-environment, *api-auth-environment, *telemetry-environment]
      ZHIXU_VERSION: ${ZHIXU_VERSION:-dev}
      ZHIXU_MODEL_SETTINGS_ROLLOUT_ID: ${ZHIXU_MODEL_SETTINGS_ROLLOUT_ID:-}
      ZHIXU_MODEL_SETTINGS_PREPARED: ${ZHIXU_MODEL_SETTINGS_PREPARED:-false}
      ZHIXU_HTTP_ADDR: 127.0.0.1:8081
      ZHIXU_DATABASE_HOST: postgres
      ZHIXU_DATABASE_PORT: 5432
      ZHIXU_DATABASE_NAME: ${ZHIXU_POSTGRES_DB:-zhixu}
      ZHIXU_DATABASE_USER: ${ZHIXU_POSTGRES_USER:-zhixu}
      ZHIXU_DATABASE_PASSWORD: ${ZHIXU_POSTGRES_PASSWORD:?set ZHIXU_POSTGRES_PASSWORD}
      ZHIXU_GRAPH_QUERY_TIMEOUT: ${ZHIXU_GRAPH_QUERY_TIMEOUT:-2s}
      ZHIXU_WEB_ASSETS_DIR: /app/web
      ZHIXU_WORKER_QUEUE: ${ZHIXU_WORKER_QUEUE:-workflow}
    depends_on:
      migrate:
        condition: service_completed_successfully
      model-settings-key-init:
        condition: service_completed_successfully
    ports:
      - target: 8080
        host_ip: 127.0.0.1
        protocol: tcp
    volumes:
      - type: volume
        source: zhixu-model-secrets
        target: /run/zhixu-model-secrets
        read_only: true
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8081/readyz"]
      interval: 5s
      timeout: 3s
      retries: 20

  firewall:
    profiles: ["workspace-runtime"]
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    entrypoint: ["/app/loopback-firewall.sh"]
    user: "0:0"
    cap_add:
      - NET_ADMIN
    network_mode: "service:app"
    depends_on:
      app:
        condition: service_started

  proxy:
    profiles: ["workspace-runtime"]
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    entrypoint: ["socat", "TCP-LISTEN:8080,fork,reuseaddr", "TCP:127.0.0.1:8081"]
    user: "10001:10001"
    network_mode: "service:app"
    depends_on:
      firewall:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/readyz"]
      interval: 5s
      timeout: 3s
      retries: 20

  app-model-relay:
    profiles: ["workspace-runtime"]
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: on-failure
    entrypoint: ["socat", "TCP-LISTEN:11434,bind=127.0.0.1,fork,reuseaddr", "TCP:host.docker.internal:11434"]
    user: "10001:10001"
    network_mode: "service:app"
    depends_on:
      app:
        condition: service_started

  worker:
    profiles: ["workspace-runtime"]
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    user: "10001:10001"
    restart: ${ZHIXU_WORKER_RESTART_POLICY:-on-failure}
    entrypoint: ["/app/zhixu-worker"]
    environment:
      <<: [*tool-environment, *runtime-environment, *model-settings-environment, *telemetry-environment]
      ZHIXU_VERSION: ${ZHIXU_VERSION:-dev}
      ZHIXU_MODEL_SETTINGS_ROLLOUT_ID: ${ZHIXU_MODEL_SETTINGS_ROLLOUT_ID:-}
      ZHIXU_MODEL_SETTINGS_PREPARED: ${ZHIXU_MODEL_SETTINGS_PREPARED:-false}
      ZHIXU_DATABASE_HOST: postgres
      ZHIXU_DATABASE_PORT: 5432
      ZHIXU_DATABASE_NAME: ${ZHIXU_POSTGRES_DB:-zhixu}
      ZHIXU_DATABASE_USER: ${ZHIXU_POSTGRES_USER:-zhixu}
      ZHIXU_DATABASE_PASSWORD: ${ZHIXU_POSTGRES_PASSWORD:?set ZHIXU_POSTGRES_PASSWORD}
      ZHIXU_WORKER_HEALTH_ADDR: 0.0.0.0:8081
      ZHIXU_WORKER_QUEUE: ${ZHIXU_WORKER_QUEUE:-workflow}
      ZHIXU_WORKER_MAX_WORKERS: ${ZHIXU_WORKER_MAX_WORKERS:-4}
      ZHIXU_WORKER_JOB_TIMEOUT: ${ZHIXU_WORKER_JOB_TIMEOUT:-15m}
      ZHIXU_WORKER_RESCUE_STUCK_AFTER: ${ZHIXU_WORKER_RESCUE_STUCK_AFTER:-30m}
      ZHIXU_WORKFLOW_LEASE: ${ZHIXU_WORKFLOW_LEASE:-2m}
      ZHIXU_WORKFLOW_HEARTBEAT: ${ZHIXU_WORKFLOW_HEARTBEAT:-30s}
      ZHIXU_REINDEX_DISPATCH_POLL_INTERVAL: ${ZHIXU_REINDEX_DISPATCH_POLL_INTERVAL:-1s}
      ZHIXU_REINDEX_DISPATCH_BATCH_SIZE: ${ZHIXU_REINDEX_DISPATCH_BATCH_SIZE:-10}
      ZHIXU_REINDEX_DISPATCH_ERROR_BACKOFF: ${ZHIXU_REINDEX_DISPATCH_ERROR_BACKOFF:-5s}
      ZHIXU_REINDEX_LEASE_DURATION: ${ZHIXU_REINDEX_LEASE_DURATION:-2m}
      ZHIXU_REINDEX_HEARTBEAT_INTERVAL: ${ZHIXU_REINDEX_HEARTBEAT_INTERVAL:-30s}
      ZHIXU_RETRIEVAL_RRF_K: ${ZHIXU_RETRIEVAL_RRF_K:-60}
      ZHIXU_RETRIEVAL_RRF_LEXICAL_CANDIDATE_LIMIT: ${ZHIXU_RETRIEVAL_RRF_LEXICAL_CANDIDATE_LIMIT:-200}
      ZHIXU_RETRIEVAL_RRF_VECTOR_CANDIDATE_LIMIT: ${ZHIXU_RETRIEVAL_RRF_VECTOR_CANDIDATE_LIMIT:-200}
      ZHIXU_RETRIEVAL_RRF_FUSED_CANDIDATE_LIMIT: ${ZHIXU_RETRIEVAL_RRF_FUSED_CANDIDATE_LIMIT:-100}
      ZHIXU_RETRIEVAL_RRF_RERANK_CANDIDATE_LIMIT: ${ZHIXU_RETRIEVAL_RRF_RERANK_CANDIDATE_LIMIT:-50}
      ZHIXU_WORKER_SOFT_STOP_TIMEOUT: ${ZHIXU_WORKER_SOFT_STOP_TIMEOUT:-30s}
      ZHIXU_WORKER_HARD_STOP_TIMEOUT: ${ZHIXU_WORKER_HARD_STOP_TIMEOUT:-60s}
    depends_on:
      migrate:
        condition: service_completed_successfully
      model-settings-key-init:
        condition: service_completed_successfully
    volumes:
      - type: volume
        source: zhixu-model-secrets
        target: /run/zhixu-model-secrets
        read_only: true
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8081/readyz"]
      interval: 5s
      timeout: 3s
      retries: 20
    stop_grace_period: ${ZHIXU_WORKER_STOP_GRACE_PERIOD:-70s}

  worker-model-relay:
    profiles: ["workspace-runtime"]
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: on-failure
    entrypoint: ["socat", "TCP-LISTEN:11434,bind=127.0.0.1,fork,reuseaddr", "TCP:host.docker.internal:11434"]
    user: "10001:10001"
    network_mode: "service:worker"
    depends_on:
      worker:
        condition: service_started

  modelctl:
    profiles: ["modelctl"]
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    entrypoint: ["/app/zhixu-modelctl"]
    environment:
      <<: [*runtime-environment, *model-settings-environment]
      ZHIXU_DATABASE_HOST: postgres
      ZHIXU_DATABASE_PORT: 5432
      ZHIXU_DATABASE_NAME: ${ZHIXU_POSTGRES_DB:-zhixu}
      ZHIXU_DATABASE_USER: ${ZHIXU_POSTGRES_USER:-zhixu}
      ZHIXU_DATABASE_PASSWORD: ${ZHIXU_POSTGRES_PASSWORD:?set ZHIXU_POSTGRES_PASSWORD}
      ZHIXU_WORKER_QUEUE: ${ZHIXU_WORKER_QUEUE:-workflow}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      model-settings-key-init:
        condition: service_completed_successfully
    volumes:
      - type: volume
        source: zhixu-model-secrets
        target: /run/zhixu-model-secrets
        read_only: true

volumes:
  zhixu-postgres:
  zhixu-model-secrets:
