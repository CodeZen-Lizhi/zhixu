services:
  app-model-relay:
    entrypoint:
      - /bin/sh
      - -ec
      - |
        embedding_pid=''
        chat_pid=''
        cleanup() {
          [ -z "$${embedding_pid}" ] || kill "$${embedding_pid}" >/dev/null 2>&1 || true
          [ -z "$${chat_pid}" ] || kill "$${chat_pid}" >/dev/null 2>&1 || true
          [ -z "$${embedding_pid}" ] || wait "$${embedding_pid}" >/dev/null 2>&1 || true
          [ -z "$${chat_pid}" ] || wait "$${chat_pid}" >/dev/null 2>&1 || true
        }
        trap cleanup EXIT HUP INT TERM
        socat TCP-LISTEN:11434,bind=127.0.0.1,fork,reuseaddr TCP:host.docker.internal:11434 &
        embedding_pid=$$!
        socat TCP-LISTEN:11435,bind=127.0.0.1,fork,reuseaddr TCP:host.docker.internal:$${ZHIXU_RAG_PROVIDER_HOST_RELAY_PORT:?host relay port is required} &
        chat_pid=$$!
        wait -n
    environment:
      ZHIXU_RAG_PROVIDER_HOST_RELAY_PORT: ${ZHIXU_RAG_PROVIDER_HOST_RELAY_PORT:?set ZHIXU_RAG_PROVIDER_HOST_RELAY_PORT}

  worker-model-relay:
    entrypoint:
      - /bin/sh
      - -ec
      - |
        embedding_pid=''
        chat_pid=''
        cleanup() {
          [ -z "$${embedding_pid}" ] || kill "$${embedding_pid}" >/dev/null 2>&1 || true
          [ -z "$${chat_pid}" ] || kill "$${chat_pid}" >/dev/null 2>&1 || true
          [ -z "$${embedding_pid}" ] || wait "$${embedding_pid}" >/dev/null 2>&1 || true
          [ -z "$${chat_pid}" ] || wait "$${chat_pid}" >/dev/null 2>&1 || true
        }
        trap cleanup EXIT HUP INT TERM
        socat TCP-LISTEN:11434,bind=127.0.0.1,fork,reuseaddr TCP:host.docker.internal:11434 &
        embedding_pid=$$!
        socat TCP-LISTEN:11435,bind=127.0.0.1,fork,reuseaddr TCP:host.docker.internal:$${ZHIXU_RAG_PROVIDER_HOST_RELAY_PORT:?host relay port is required} &
        chat_pid=$$!
        wait -n
    environment:
      ZHIXU_RAG_PROVIDER_HOST_RELAY_PORT: ${ZHIXU_RAG_PROVIDER_HOST_RELAY_PORT:?set ZHIXU_RAG_PROVIDER_HOST_RELAY_PORT}
