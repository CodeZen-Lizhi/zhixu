# Legacy/static model environment for isolated Compose smokes only. The normal
# development stack uses database-managed model settings from compose.yml.
x-static-embedding-environment: &static-embedding-environment
  ZHIXU_EMBEDDING_PROVIDER: ${ZHIXU_EMBEDDING_PROVIDER:-disabled}
  ZHIXU_EMBEDDING_BASE_URL: ${ZHIXU_EMBEDDING_BASE_URL:-}
  ZHIXU_EMBEDDING_API_KEY: ${ZHIXU_EMBEDDING_API_KEY:-}
  ZHIXU_EMBEDDING_MODEL: ${ZHIXU_EMBEDDING_MODEL:-}
  ZHIXU_EMBEDDING_DIMENSIONS: ${ZHIXU_EMBEDDING_DIMENSIONS:-0}
  ZHIXU_EMBEDDING_NORMALIZATION: ${ZHIXU_EMBEDDING_NORMALIZATION:-l2}
  ZHIXU_EMBEDDING_DISTANCE_METRIC: ${ZHIXU_EMBEDDING_DISTANCE_METRIC:-cosine}
  ZHIXU_EMBEDDING_MAX_BATCH_SIZE: ${ZHIXU_EMBEDDING_MAX_BATCH_SIZE:-128}
  ZHIXU_EMBEDDING_MAX_INPUT_BYTES: ${ZHIXU_EMBEDDING_MAX_INPUT_BYTES:-65536}
  ZHIXU_EMBEDDING_MAX_BATCH_INPUT_BYTES: ${ZHIXU_EMBEDDING_MAX_BATCH_INPUT_BYTES:-8388608}
  ZHIXU_EMBEDDING_TIMEOUT: ${ZHIXU_EMBEDDING_TIMEOUT:-30s}
  ZHIXU_EMBEDDING_MAX_RESPONSE_BYTES: ${ZHIXU_EMBEDDING_MAX_RESPONSE_BYTES:-67108864}

x-static-chat-environment: &static-chat-environment
  ZHIXU_CHAT_PROVIDER: ${ZHIXU_CHAT_PROVIDER:-disabled}
  ZHIXU_CHAT_API_STYLE: ${ZHIXU_CHAT_API_STYLE:-chat_completions}
  ZHIXU_CHAT_BASE_URL: ${ZHIXU_CHAT_BASE_URL:-}
  ZHIXU_CHAT_API_KEY: ${ZHIXU_CHAT_API_KEY:-}
  ZHIXU_CHAT_MODEL: ${ZHIXU_CHAT_MODEL:-}
  ZHIXU_CHAT_MODEL_VERSION: ${ZHIXU_CHAT_MODEL_VERSION:-}
  ZHIXU_CHAT_ADAPTER_VERSION: ${ZHIXU_CHAT_ADAPTER_VERSION:-v1}
  ZHIXU_CHAT_TIMEOUT: ${ZHIXU_CHAT_TIMEOUT:-30s}
  ZHIXU_CHAT_MAX_REQUEST_BYTES: ${ZHIXU_CHAT_MAX_REQUEST_BYTES:-4194304}
  ZHIXU_CHAT_MAX_RESPONSE_BYTES: ${ZHIXU_CHAT_MAX_RESPONSE_BYTES:-4194304}

services:
  local-model-runtime:
    depends_on: !reset {}
    volumes: !override
      - type: volume
        source: zhixu-local-models
        target: /var/lib/zhixu/ollama/.ollama
    environment:
      ZHIXU_DATABASE_HOST: ""
      ZHIXU_DATABASE_PORT: ""
      ZHIXU_DATABASE_NAME: ""
      ZHIXU_DATABASE_USER: ""
      ZHIXU_DATABASE_PASSWORD: ""
      ZHIXU_DATABASE_MAX_CONNS: ""
      ZHIXU_DATABASE_MIN_CONNS: ""
      ZHIXU_DATABASE_USER_FILE: ""
      ZHIXU_DATABASE_PASSWORD_FILE: ""
      ZHIXU_LOCAL_MODEL_RUNTIME_MODE: external-static

  app:
    environment:
      <<: [*static-embedding-environment, *static-chat-environment]
      ZHIXU_MODEL_SETTINGS_MODE: static
      ZHIXU_MODEL_SETTINGS_KEY_FILE: ""
      ZHIXU_MODEL_SETTINGS_ROLLOUT_ID: ""
      ZHIXU_MODEL_SETTINGS_PREPARED: "false"

  worker:
    environment:
      <<: [*static-embedding-environment, *static-chat-environment]
      ZHIXU_MODEL_SETTINGS_MODE: static
      ZHIXU_MODEL_SETTINGS_KEY_FILE: ""
      ZHIXU_MODEL_SETTINGS_ROLLOUT_ID: ""
      ZHIXU_MODEL_SETTINGS_PREPARED: "false"

  app-model-relay:
    entrypoint: ["socat", "TCP-LISTEN:11434,bind=127.0.0.1,fork,reuseaddr", "TCP:host.docker.internal:11434"]

  worker-model-relay:
    entrypoint: ["socat", "TCP-LISTEN:11434,bind=127.0.0.1,fork,reuseaddr", "TCP:host.docker.internal:11434"]
