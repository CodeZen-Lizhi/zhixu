name: zhixu-netns

services:
  app-netns:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: zhixu-app-netns
    entrypoint: ["/app/netns-ingress.sh"]
    user: "0:0"
    restart: unless-stopped
    cap_drop:
      - ALL
    cap_add:
      - NET_ADMIN
      # SETUID/SETGID are used only by setpriv during PID 1 bootstrap; the
      # long-running socat process has all effective/permitted capabilities
      # cleared before it starts listening.
      - SETUID
      - SETGID
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /run:rw,noexec,nosuid,size=65536
    ports:
      - target: 8080
        published: ${ZHIXU_HTTP_PORT:-8080}
        host_ip: 127.0.0.1
        protocol: tcp
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "ss -H -ltn 'sport = :8080' | grep -q '0.0.0.0:8080'"]
      interval: 5s
      timeout: 3s
      retries: 20

  worker-netns:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: zhixu-worker-netns
    entrypoint: ["/app/netns-ingress.sh", "--worker-sentinel"]
    user: "10001:10001"
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:18082"]
      interval: 5s
      timeout: 3s
      retries: 20

networks:
  default:
    name: zhixu-runtime
